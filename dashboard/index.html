<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>TechMind Central — Creator Dashboard</title>
  <style>
    body{font-family:system-ui,sans-serif;margin:0;background:#0b1020;color:#eef2ff}
    main{max-width:1100px;margin:auto;padding:32px}
    .grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:16px}
    .card{background:#151c33;border:1px solid #293452;border-radius:16px;padding:20px}
    .muted{color:#aab4d0}
  </style>
</head>
<body>
<main>
  <h1>TechMind Central</h1>
  <p class="muted">Creator Operations Dashboard</p>
  <section class="grid">
    <div class="card"><b>YouTube Views</b><h2 id="views">—</h2></div>
    <div class="card"><b>Subscribers</b><h2 id="subs">—</h2></div>
    <div class="card"><b>Watch Time</b><h2 id="watch">—</h2></div>
    <div class="card"><b>Content Ready</b><h2 id="ready">—</h2></div>
  </section>
  <div class="card" style="margin-top:16px">
    <h2>Daily Creator Log</h2>
    <p class="muted">Research → production → Drive → publishing → performance → next-video insights.</p>
  </div>
</main>
</body>
</html>
